name: Daily Investment Run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: daily-investment-run
  cancel-in-progress: false

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Ho_Chi_Minh
      TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MARKET_PROVIDER: ${{ secrets.MARKET_PROVIDER }}
      NEWS_PROVIDER: ${{ secrets.NEWS_PROVIDER }}
      FINANCIALS_PROVIDER: ${{ secrets.FINANCIALS_PROVIDER }}
      AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_TIMEOUT_SECONDS: ${{ secrets.OPENAI_TIMEOUT_SECONDS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Prepare CI runtime config
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path.cwd()
          runtime_path = root / "config" / "runtime.yaml"
          ci_config_dir = root / "config" / "ci"
          ci_config_dir.mkdir(parents=True, exist_ok=True)

          runtime = yaml.safe_load(runtime_path.read_text(encoding="utf-8")) or {}
          runtime["selection"] = {
              **dict(runtime.get("selection", {})),
              "mode": "watchlist",
              "fallback_to_watchlist": True,
          }
          runtime["features"] = {
              **dict(runtime.get("features", {})),
              "market_overview": False,
          }

          (ci_config_dir / "runtime.yaml").write_text(
              yaml.safe_dump(runtime, sort_keys=False, allow_unicode=True),
              encoding="utf-8",
          )

          for name in ("sources.yaml", "watchlist.yaml", "universe.yaml"):
              src = root / "config" / name
              if src.exists():
                  (ci_config_dir / name).write_text(src.read_text(encoding="utf-8"), encoding="utf-8")
          PY

      - name: Run daily pipeline
        run: python scripts/run_trading_terminal.py --config-dir config/ci --ai-mode api

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-artifacts-${{ github.run_id }}
          path: |
            reports/**
            artifacts/**
            manifests/**
            logs/**
          if-no-files-found: warn
          retention-days: 14
