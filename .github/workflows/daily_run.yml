name: Daily Investment Run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  daily-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run smoke test
        run: python --version
