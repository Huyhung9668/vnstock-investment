name: Daily Investment Run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: daily-investment-run
  cancel-in-progress: false

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Ho_Chi_Minh
      TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MARKET_PROVIDER: ${{ secrets.MARKET_PROVIDER }}
      NEWS_PROVIDER: ${{ secrets.NEWS_PROVIDER }}
      FINANCIALS_PROVIDER: ${{ secrets.FINANCIALS_PROVIDER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Run daily pipeline
        run: python scripts/daily_run.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-artifacts-${{ github.run_id }}
          path: |
            reports/**
            artifacts/**
            manifests/**
            logs/**
          if-no-files-found: warn
          retention-days: 14
